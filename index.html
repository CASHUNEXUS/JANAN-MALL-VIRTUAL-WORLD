<script type="module">

scene.add(new THREE.HemisphereLight(0xdce9ff,0x5a4634,2.0));

for(let side of [-1,1]){
 for(let i=0;i<5;i++){const x=side*(5+i*3.1);box(1.2,10,.9,mats.stone,x,5,-22);box(1.45,.35,1.2,mats.gold,x,10,-22)}
 // upper galleries and glass rails
 box(42,.65,7,mats.stone,0,5.2,-9);box(42,.18,.18,mats.gold,0,5.7,-5.5);box(42,.65,7,mats.stone,0,9.4,-9);box(42,.18,.18,mats.gold,0,9.9,-5.5);
 const rail=box(42,1.05,.12,mats.glass,0,6.05,-5.55,false);box(42,.08,.16,mats.gold,0,6.6,-5.55,false);
 box(42,1.05,.12,mats.glass,0,10.25,-5.55,false);box(42,.08,.16,mats.gold,0,10.8,-5.55,false);
}
// back and side storefronts, lit display windows
const storeData=[{x:-9,z:1,name:'JANAN BOUTIQUE',desc:'Contemporary fashion and signature collections.',items:[['Evening outfit','4,900'],['Leather bag','3,200'],['Signature shoes','2,750'],['Accessories','890']]},{x:-3,z:-8,name:'GOLDEN LIVING',desc:'Elegant objects for a beautiful home.',items:[['Table lamp','1,450'],['Decor vase','980'],['Art object','2,100'],['Cushion set','650']]},{x:3,z:-8,name:'TECH AVENUE',desc:'A curated destination for modern technology.',items:[['Headphones','3,800'],['Smart watch','5,400'],['Wireless speaker','2,600'],['Camera','12,900']]},{x:9,z:1,name:'NOIR PERFUMERY',desc:'A world of refined scents.',items:[['Eau de parfum','2,900'],['Discovery set','1,250'],['Home fragrance','1,100'],['Gift set','3,500']]}];
const storeMeshes=[];
storeData.forEach((s,i)=>{const group=new THREE.Group();group.position.set(s.x,0,s.z);scene.add(group);const back=new THREE.Mesh(new THREE.BoxGeometry(8,4.6,.35),mats.dark);back.position.set(0,2.3,0);group.add(back);const glass=new THREE.Mesh(new THREE.BoxGeometry(7.7,3.5,.12),mats.glass);glass.position.set(0,2.15,.25);group.add(glass);const top=new THREE.Mesh(new THREE.BoxGeometry(8.4,.35,.7),mats.gold);top.position.set(0,4.7,0);group.add(top);const sign=label(s.name,0,4.85,.42,.7);group.add(sign);for(let k=0;k<3;k++){const shelf=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.5,.65),k%2?mats.wood:mats.stone);shelf.position.set(-2.5+k*2.5,1.0,.5);group.add(shelf);for(let j=0;j<3;j++){const product=new THREE.Mesh(new THREE.BoxGeometry(.42,.6,.38),[mats.gold,mats.green,mats.white][(j+k)%3]);product.position.set(-2.8+k*2.5+j*.28,2.1,.55);group.add(product)}}storeMeshes.push(group)});
// grand circular skylight and chandelier
for(let y of [12.8,13.1])ring(6,.16,mats.gold,0,y,-2);
for(let i=0;i<12;i++){const a=i*Math.PI/6;const l=new THREE.PointLight(0xffd28a,9,13);l.position.set(Math.cos(a)*5,11.8,-2+Math.sin(a)*5);scene.add(l)}
for(let i=0;i<8;i++){const a=i*Math.PI/4;const p=cyl(.12,.12,1.8,mats.gold,Math.cos(a)*4,11.7,-2+Math.sin(a)*4);p.rotation.z=Math.PI/2}
cyl(1.1,1.1,.18,mats.gold,0,11.2,-2);cyl(.55,.55,.5,mats.white,0,10.9,-2);
// central information desk
cyl(3.5,3.8,.65,mats.stone,0,.35,1,64);cyl(3.45,3.45,.12,mats.gold,0,.72,1,64);cyl(2.4,2.4,.08,mats.dark,0,.82,1,64);label('INFORMATION',0,1.3,1,0.6).rotation.y=0;
for(let i=0;i<8;i++){const a=i*Math.PI/4;const x=Math.cos(a)*3.2,z=1+Math.sin(a)*3.2;cyl(.08,.08,1.1,mats.gold,x,.9,z,12)}
// escalators
function escalator(x,z,dir){const base=box(3,.35,11,mats.dark,x,1.05,z);base.rotation.x=dir*.28;const slope=box(2.5,.16,10,mats.gold,x,1.45,z);slope.rotation.x=dir*.28;for(let i=0;i<13;i++){let st=box(2.25,.08,.48,mats.stone,x,1.5+i*.14,z-4.4+i*.72,false);st.rotation.x=dir*.28}const rail=box(.12,.8,10,mats.glass,x-1.35,1.9,z);rail.rotation.x=dir*.28;const rail2=box(.12,.8,10,mats.glass,x+1.35,1.9,z);rail2.rotation.x=dir*.28;box(.14,.1,10,mats.gold,x-1.35,2.32,z).rotation.x=dir*.28;box(.14,.1,10,mats.gold,x+1.35,2.32,z).rotation.x=dir*.28}
escalator(-7,-1,-1);escalator(7,-1,1);
// planters, greenery and benches
function tree(x,z){cyl(.22,.32,2,mats.wood,x,1,z,12);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.2,14,12),mats.green);crown.position.set(x,2.7,z);crown.castShadow=true;scene.add(crown);cyl(1.25,1.35,.5,mats.dark,x,.15,z,32);cyl(1.18,1.18,.12,mats.stone,x,.43,z,32)}
[[-17,-1],[17,-1],[-17,14],[17,14],[-10,18],[10,18]].forEach(p=>tree(p[0],p[1]));
for(let side of [-1,1]){box(4,.55,1.1,mats.wood,side*13,.55,4);box(4,.12,1.2,mats.gold,side*13,.87,4)}
// ceiling ribs and light strips
for(let i=-4;i<=4;i++){const rib=box(.16,.18,36,mats.gold,i*4,13.6,-3);rib.material=new THREE.MeshStandardMaterial({color:0x8f9cab,metalness:.7,roughness:.25})}
const strips=[];for(let x=-16;x<=16;x+=8){const strip=box(.08,.08,30,new THREE.MeshBasicMaterial({color:0x86c9ff}),x,13.45,-2,false);strips.push(strip)}
// avatar
const avatar=new THREE.Group();scene.add(avatar);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,4,8),new THREE.MeshStandardMaterial({color:0x263a50,roughness:.65}));body.position.y=1.25;body.castShadow=true;avatar.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.3,18,14),new THREE.MeshStandardMaterial({color:0xd6a77f,roughness:.7}));head.position.y=2.05;head.castShadow=true;avatar.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.31,16,10,0,Math.PI*2,0,Math.PI*.55),new THREE.MeshStandardMaterial({color:0x30251f}));hair.position.y=2.15;avatar.add(hair);
for(let side of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.55,3,6),new THREE.MeshStandardMaterial({color:0x17202a}));leg.position.set(side*.2,.42,0);leg.castShadow=true;avatar.add(leg)}
let player={x:0,z:17,rot:Math.PI};avatar.position.set(player.x,0,player.z);
const keys={};let started=false,shopOpen=false,nearStore=-1;
function openShop(i){if(i<0)return;shopOpen=true;const s=storeData[i];document.getElementById('shopName').textContent=s.name;document.getElementById('shopDesc').textContent=s.desc;document.getElementById('items').innerHTML=s.items.map(a=>'<div class="item"><strong>'+a[0]+'</strong><small>€ '+a[1]+'</small></div>').join('');document.getElementById('panel').style.display='flex'}
function closeShop(){shopOpen=false;document.getElementById('panel').style.display='none'}
document.getElementById('leave').onclick=closeShop;document.getElementById('begin').onclick=()=>{started=true;document.getElementById('start').style.display='none'};
document.getElementById('enterShop').onclick=()=>openShop(nearStore);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Enter'||e.key.toLowerCase()==='e')openShop(nearStore)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;
if(started&&!shopOpen){let f=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0);let side=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);if(f||side){const speed=5.0*dt;const angle=player.rot;player.x+= (Math.sin(angle)*f+Math.cos(angle)*side)*speed;player.z+=(-Math.cos(angle)*f+Math.sin(angle)*side)*speed;player.x=THREE.MathUtils.clamp(player.x,-18,18);player.z=THREE.MathUtils.clamp(player.z,-21,25);avatar.rotation.y=player.rot;body.position.y=1.25+Math.sin(now*.014)*.035}}
avatar.position.set(player.x,0,player.z);
const desired=new THREE.Vector3(player.x+Math.sin(player.rot)*8,5.2,player.z+Math.cos(player.rot)*9);camera.position.lerp(desired,.08);camera.lookAt(player.x,1.6,player.z-2.5);
nearStore=-1;let min=999;storeData.forEach((s,i)=>{const d=Math.hypot(player.x-s.x,player.z-s.z);if(d<min){min=d;nearStore=i}});if(min>8)nearStore=-1;
document.getElementById('hint').textContent=nearStore>=0?'PRESS ENTER TO EXPLORE '+storeData[nearStore].name:'WASD / ARROWS TO WALK · EXPLORE THE ATRIUM';
renderer.render(scene,camera)}
camera.position.set(0,6,25);camera.lookAt(0,1,0);requestAnimationFrame(animate);
