<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10151b"><title>JANAN MALL | TABRIZ — Virtual World</title>
<style>
:root{--gold:#d8b56d;--ink:#10151b;--cream:#eee8dc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;color:white;font-family:Inter,Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#brand{position:fixed;top:18px;left:20px;z-index:3;letter-spacing:.18em;font-size:12px;color:#f4e8d0;text-shadow:0 2px 10px #000}#brand b{display:block;font-size:20px;letter-spacing:.22em;color:var(--gold)}#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10151bdc;border:1px solid #d8b56d88;border-radius:30px;padding:11px 18px;font-size:12px;letter-spacing:.08em;white-space:nowrap;z-index:3}#panel{display:none;position:fixed;inset:0;z-index:5;background:transparent;align-items:flex-start;justify-content:flex-start;padding:82px 18px 18px;pointer-events:none}#card{pointer-events:auto;width:min(340px,100%);background:linear-gradient(145deg,#26303af2,#11171ef2);border:1px solid #d8b56d88;border-radius:18px;padding:20px;box-shadow:0 20px 80px #000}#card h2{color:var(--gold);letter-spacing:.16em;margin:0 0 8px}#card p{color:#c6cbd0;line-height:1.5}#items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.item{background:#ffffff0b;border:1px solid #ffffff20;border-radius:12px;padding:13px}.item strong{display:block;color:#f5e7ca}.item small{color:#c2a66d}button{background:var(--gold);border:0;border-radius:30px;padding:12px 22px;font-weight:700;color:#161616}#start{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 40%,#3d454a,#11171d 65%,#090d12);display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}#start h1{font-size:clamp(32px,8vw,68px);letter-spacing:.18em;color:var(--gold);margin:0}#start p{color:#d8d2c7;letter-spacing:.22em;font-size:11px;margin:14px 0 30px}#start button{padding:15px 34px;letter-spacing:.12em}#controls{position:fixed;right:18px;bottom:22px;z-index:4;display:grid;grid-template-columns:repeat(3,48px);gap:5px;opacity:.8}#controls button{padding:0;width:48px;height:44px;border-radius:12px;background:#202b35dd;color:#f4dfb5;border:1px solid #d8b56d66;font-size:18px;touch-action:none}#controls button:nth-child(1){grid-column:2}#controls button:nth-child(2){grid-column:1;grid-row:2}#controls button:nth-child(3){grid-column:2;grid-row:2}#controls button:nth-child(4){grid-column:3;grid-row:2}#controls button:nth-child(5){grid-column:2;grid-row:3;font-size:11px}#floor{position:fixed;top:18px;right:20px;color:#d7c39c;font-size:10px;letter-spacing:.15em;z-index:3}
</style></head><body>
<div id="brand"><b>JANAN MALL</b>TABRIZ · VIRTUAL WORLD</div><div id="floor">GROUND FLOOR · 01</div><canvas id="view"></canvas><div id="hint">WASD / ARROWS TO WALK · APPROACH A STORE TO ENTER</div>
<div id="controls"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button id="enterShop">ENTER</button></div>
<div id="start"><div><h1>JANAN MALL</h1><p>AN IMMERSIVE SHOPPING DESTINATION · TABRIZ</p><button id="begin">ENTER THE MALL</button></div></div>
<div id="panel"><div id="card"><h2 id="shopName">JANAN BOUTIQUE</h2><p id="shopDesc">Discover the collection.</p><div id="items"></div><button id="leave">← BACK TO THE MALL</button></div></div>
<script>
(()=>{const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let W,H,dpr,active=false,mode='mall',x=0,z=0,keys={},near=null,walk=0;
const stores=[{x:-2.5,z:5,name:'JANAN BOUTIQUE',desc:'Contemporary fashion and signature collections.',items:[['Evening outfit','₺ 4,900'],['Leather bag','₺ 3,200'],['Signature shoes','₺ 2,750'],['Accessories','₺ 890']]},{x:2.5,z:5,name:'GOLDEN LIVING',desc:'Elegant objects for a beautiful home.',items:[['Table lamp','₺ 1,450'],['Decor vase','₺ 980'],['Art object','₺ 2,100'],['Cushion set','₺ 650']]},{x:-2.5,z:12,name:'TECH AVENUE',desc:'A curated destination for modern technology.',items:[['Headphones','₺ 3,800'],['Smart watch','₺ 5,400'],['Wireless speaker','₺ 2,600'],['Camera','₺ 12,900']]},{x:2.5,z:12,name:'NOIR PERFUMERY',desc:'A world of refined scents.',items:[['Eau de parfum','₺ 2,900'],['Discovery set','₺ 1,250'],['Home fragrance','₺ 1,100'],['Gift set','₺ 3,500']]}];
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function poly(a,fill,stroke){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function text(t,x,y,size,color,align='center'){ctx.fillStyle=color;ctx.font='600 '+size+'px Arial';ctx.textAlign=align;ctx.fillText(t,x,y)}
function mall(){let horizon=H*.37,scale=Math.min(W/900,1.25),cx=W/2;let camX=x*23,camZ=z*17;
let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#18232d');sky.addColorStop(.55,'#596068');sky.addColorStop(1,'#1a2025');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
// grand atrium rear wall and upper galleries
poly([[cx-440*scale-camX*.25,horizon],[cx+440*scale-camX*.25,horizon],[cx+600*scale-camX*.25,H*.68],[cx-600*scale-camX*.25,H*.68]],'#343d43','#a98b58');
for(let lev=0;lev<3;lev++){let yy=horizon+lev*H*.105;poly([[cx-440*scale-camX*.25,yy],[cx+440*scale-camX*.25,yy],[cx+510*scale-camX*.25,yy+14],[cx-510*scale-camX*.25,yy+14]],'#b99b68');ctx.fillStyle='#101820';ctx.fillRect(cx-430*scale-camX*.25,yy+14,860*scale,42*scale);for(let i=0;i<7;i++){let sx=cx-390*scale+i*130*scale-camX*.25;ctx.fillStyle=['#6c5140','#263c48','#6a5a49','#34444b'][i%4];ctx.fillRect(sx,yy+20,95*scale,35*scale);ctx.strokeStyle='#d4b77c';ctx.strokeRect(sx,yy+20,95*scale,35*scale)}}
poly([[0,H*.64],[W,H*.64],[W,H],[0,H]],'#b9ad9a');let floor=ctx.createLinearGradient(0,H*.62,0,H);floor.addColorStop(0,'#756e65');floor.addColorStop(.45,'#c9c0b2');floor.addColorStop(1,'#615d58');ctx.fillStyle=floor;ctx.fillRect(0,H*.64,W,H*.36);
for(let i=-5;i<=5;i++){ctx.strokeStyle='#e4d9c6aa';ctx.beginPath();ctx.moveTo(cx+i*35*scale-camX,H*.65);ctx.lineTo(cx+i*130*scale-camX,H);ctx.stroke()}for(let j=0;j<5;j++){ctx.strokeStyle='#e4d9c655';ctx.beginPath();ctx.moveTo(0,H*.69+j*j*10);ctx.lineTo(W,H*.69+j*j*10);ctx.stroke()}
// columns
for(let side of [-1,1])for(let i=0;i<3;i++){let px=cx+side*(250+i*80)*scale-camX*.7,py=horizon+i*H*.11;ctx.fillStyle='#c8b99e';ctx.fillRect(px-13*scale,py,26*scale,H*.37);ctx.fillStyle='#e0c78e';ctx.fillRect(px-17*scale,py,34*scale,8*scale);ctx.fillStyle='#8d7c63';ctx.fillRect(px-16*scale,py+H*.37,32*scale,9*scale)}
// chandelier
for(let i=0;i<3;i++){let yy=H*.2+i*18;ctx.strokeStyle='#d6b779';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,yy);ctx.stroke();ctx.beginPath();ctx.ellipse(cx,yy+8,90-i*18,10,0,0,Math.PI*2);ctx.stroke();for(let a=0;a<8;a++){let q=a*Math.PI/4;ctx.fillStyle='#f6dca1';ctx.beginPath();ctx.arc(cx+Math.cos(q)*(90-i*18),yy+8+Math.sin(q)*7,3,0,Math.PI*2);ctx.fill()}}
// storefronts in perspective, scroll based on player world coordinates
stores.forEach((s,i)=>{let sx=cx+s.x*65*scale,sy=H*.52+s.z*4;let width=145*scale,height=100*scale;ctx.save();ctx.shadowColor='#0009';ctx.shadowBlur=18*scale;ctx.shadowOffsetY=8*scale;ctx.fillStyle='#171e25';ctx.fillRect(sx-width/2,sy,width,height);ctx.restore();ctx.fillStyle='#b8955e';ctx.fillRect(sx-width/2,sy,width,7*scale);ctx.fillStyle='#102633';ctx.fillRect(sx-width/2+8,sy+16,width-16,height-25);ctx.fillStyle='#b7d4d833';ctx.fillRect(sx-width/2+12,sy+20,width-24,height-32);ctx.strokeStyle='#d7c092';ctx.lineWidth=2*scale;ctx.strokeRect(sx-width/2+8,sy+16,width-16,height-25);ctx.fillStyle='#d8b56d';ctx.fillRect(sx-width/2,sy-20,width,20);ctx.fillStyle='#f6dfaa';ctx.fillRect(sx-width/2,sy-20,width,2);text(s.name,sx,sy-6,Math.max(8,9*scale),'#1a1a1a');for(let k=0;k<3;k++){ctx.fillStyle=['#bda06c','#687d88','#8e6753'][k];ctx.fillRect(sx-width/2+25+k*35*scale,sy+45,18*scale,30*scale)}});
// avatar anchored center lower screen
let ax=cx+x*24*scale,ay=H*.79-z*3.5;ctx.fillStyle='#1118';ctx.beginPath();ctx.ellipse(ax,ay+26,18,7,0,0,7);ctx.fill();ctx.fillStyle='#222c35';ctx.fillRect(ax-10,ay-5,20,28);ctx.fillStyle='#d7b77d';ctx.beginPath();ctx.arc(ax,ay-14,9,0,7);ctx.fill();ctx.fillStyle='#1a2027';ctx.fillRect(ax-9,ay+20,7,13);ctx.fillRect(ax+2,ay+20,7,13);
near=stores.find(s=>Math.hypot(s.x-x,s.z-z)<2.1);document.getElementById('hint').textContent=near?'PRESS ENTER / E TO EXPLORE '+near.name:'WASD / ARROWS TO WALK · EXPLORE THE ATRIUM';
}
function shop(){ctx.fillStyle='#171d22';ctx.fillRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4a4540');g.addColorStop(1,'#171c20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);poly([[0,H*.65],[W,H*.65],[W,H],[0,H]],'#887d6c');text('JANAN MALL · STORE INTERIOR',W/2,55,13,'#d8b56d');let s=activeStore;for(let side of [-1,1]){let sx=W/2+side*W*.29;ctx.fillStyle='#6c5945';ctx.fillRect(sx-65,H*.25,130,H*.43);ctx.fillStyle='#c7a66c';ctx.fillRect(sx-70,H*.24,140,9);for(let r=0;r<3;r++){ctx.fillStyle='#c4ad89';ctx.fillRect(sx-58,H*.31+r*H*.1,116,4);for(let k=0;k<4;k++){ctx.fillStyle=['#d2b98b','#607987','#8b6152','#a6a09a'][(k+r)%4];ctx.fillRect(sx-50+k*28,H*.27+r*H*.1,18,30)}}}ctx.fillStyle='#332d28';ctx.fillRect(W*.34,H*.68,W*.32,35);ctx.fillStyle='#d8b56d';ctx.fillRect(W*.34,H*.68,W*.32,5);text(s.name,W/2,H*.17,25,'#e2c88f');text('WELCOME · DISCOVER THE COLLECTION',W/2,H*.22,11,'#e7e0d4');text('← BACK TO MALL',W/2,H*.88,13,'#f0d9a8');}
let activeStore=stores[0];function openStore(s){activeStore=s;mode='shop';document.getElementById('panel').style.display='flex';document.getElementById('shopName').textContent=s.name;document.getElementById('shopDesc').textContent=s.desc;document.getElementById('items').innerHTML=s.items.map(a=>'<div class="item"><strong>'+a[0]+'</strong><small>'+a[1]+'</small></div>').join('');}
function frame(){ctx.clearRect(0,0,W,H);if(active&&mode==='mall'){let dx=0,dz=0;if(keys.ArrowLeft||keys.a||keys.A)dx-=1;if(keys.ArrowRight||keys.d||keys.D)dx+=1;if(keys.ArrowUp||keys.w||keys.W)dz+=1;if(keys.ArrowDown||keys.s||keys.S)dz-=1;let len=Math.hypot(dx,dz)||1;x=Math.max(-5,Math.min(5,x+dx/len*.075));z=Math.max(-1,Math.min(19,z+dz/len*.11));mall()}else if(mode==='shop')shop();else mall();requestAnimationFrame(frame)}frame();
document.getElementById('begin').onclick=()=>{active=true;document.getElementById('start').style.display='none'};
document.getElementById('leave').onclick=()=>{mode='mall';document.getElementById('panel').style.display='none'};
document.getElementById('enterShop').onclick=()=>{if(near&&mode==='mall')openStore(near)};
addEventListener('keydown',e=>{keys[e.key]=true;if((e.key==='e'||e.key==='E')&&near&&mode==='mall')openStore(near)});addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('#controls button[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
})();
</script></body></html>
